<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My dashboard · Campus Found</title><link rel="stylesheet" href="/css/app.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>.dash{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 76px)}.side{padding:28px 18px;border-right:1px solid var(--border);background:#fff}.side small{font-size:10px;letter-spacing:1px;color:#a0a9b9;font-weight:700;padding:0 10px}.side button{width:100%;text-align:left;margin-top:7px;padding:11px;border:0;background:transparent;color:#647087;border-radius:8px;display:flex;gap:10px;align-items:center;font-size:13px;cursor:pointer}.side button.selected{background:#edf1ff;color:#3e5fdf;font-weight:700}.side button svg{width:16px}.dashmain{padding:35px 38px;max-width:1100px;width:100%}.dashmain h1{font-size:30px;margin:9px 0}.dashmain>p{color:#8390a4;font-size:13px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:24px 0}.tile{background:#fff;border:1px solid var(--border);border-radius:11px;padding:17px}.tile span{font-size:11px;color:#8994a8}.tile strong{font:700 24px Manrope;display:block;margin-top:10px}.dashbox{background:white;border:1px solid var(--border);border-radius:11px;padding:20px;margin-bottom:16px}.dashbox h2{font:700 16px Manrope}.rows{display:grid;gap:10px}.row{border:1px solid #edf0f5;border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:10px;font-size:13px}.row small{display:block;color:#8993a4;margin-top:5px}.admin-button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:8px 10px;cursor:pointer}@media(max-width:700px){.dash{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:9px}.side small{display:none}.side button{white-space:nowrap;width:auto}.dashmain{padding:25px 18px}.tiles{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><i data-lucide="scan-search"></i></span>campus<span>found</span></a><nav><a href="/">Community board</a></nav><div class="nav-actions"><span id="who" style="font-size:12px;color:#748096"></span><button class="button secondary small" id="logout">Log out</button></div></header><div class="dash"><aside class="side"><small>WORKSPACE</small><button class="selected"><i data-lucide="layout-dashboard"></i>Overview</button><button onclick="location.href='/#browse'"><i data-lucide="compass"></i>Explore items</button><button id="newReport"><i data-lucide="circle-plus"></i>Report an item</button><button id="myReports"><i data-lucide="files"></i>My reports</button><button id="myClaims"><i data-lucide="badge-check"></i>My claims</button><button id="notifications"><i data-lucide="bell"></i>Notifications</button><button id="profile"><i data-lucide="user-round"></i>Profile</button><button id="staffAdmin" hidden onclick="location.href='/admin.html'"><i data-lucide="shield-check"></i>Staff administration</button></aside><main class="dashmain"><span class="eyebrow">YOUR CAMPUS SPACE</span><h1 id="welcome">Welcome back</h1><p>Here’s what’s happening with your reports and claims.</p><div class="tiles" id="tiles"></div><section class="dashbox"><h2>Potential matches</h2><div class="rows" id="matches">Loading matches…</div></section><section class="dashbox"><h2 id="listTitle">Recent reports</h2><div class="rows" id="reports">Loading reports…</div></section></main></div><div id="toast" class="toast"></div><script src="/js/dashboard.js"></script></body></html>
